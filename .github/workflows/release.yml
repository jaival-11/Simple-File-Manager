name: Build Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Extract Version Name
      id: get_version
      run: |
        VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo "1.0.1")
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "App Version: $VERSION"

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Native Sign & Package APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        OUTPUT_APK="Simple-File-Manager-${VERSION}.apk"
        UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          ALIGN_FLAG=""
          if $BUILD_TOOLS/apksigner sign --help | grep -q -- "--alignment-preserved"; then
            ALIGN_FLAG="--alignment-preserved"
          fi
          $BUILD_TOOLS/apksigner sign $ALIGN_FLAG --ks release.keystore --ks-pass pass:"$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass pass:"$KEY_PASSWORD" --out "$OUTPUT_APK" "$UNSIGNED_APK"
        else
          echo "Keystore secret not present, using unsigned release APK."
          cp "$UNSIGNED_APK" "$OUTPUT_APK"
        fi

        # Compute SHA-256 checksum for reproducible build verification
        sha256sum "$OUTPUT_APK" > "${OUTPUT_APK}.sha256"

    - name: Upload APK & Checksum Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Simple-File-Manager-${{ env.VERSION }}
        path: |
          Simple-File-Manager-*.apk
          *.sha256
